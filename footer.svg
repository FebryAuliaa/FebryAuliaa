<svg xmlns="http://www.w3.org/2000/svg" width="860" height="70" viewBox="0 0 860 70" role="img" aria-label="footer">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D2B5E"/>
      <stop offset="100%" style="stop-color:#1A4A8A"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60B8FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="860" height="70" fill="url(#fBg)" rx="10"/>
  <rect y="1" width="860" height="2" fill="url(#fLine)"/>
  <text x="430" y="33" font-size="14" fill="#A8D8FF" text-anchor="middle" font-weight="bold" letter-spacing="1">Thanks for visiting! ✨</text>
  <text x="430" y="55" font-size="11" fill="#4D96FF" text-anchor="middle" letter-spacing="1">Made with 💙 by Febry  ·  Keep coding, keep shining</text>
</svg>
