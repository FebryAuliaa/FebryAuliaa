<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" role="img" aria-label="Instagram">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="iBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2"/><stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
  </defs>
  <rect width="280" height="48" fill="url(#iBg)" rx="6" stroke="#90CAF9" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="0" y="0" width="280" height="48" fill="#BBDEFB" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0.1;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="90" y="31" font-size="14" fill="#E3F2FD" text-anchor="middle" font-weight="bold">⬡ Instagram</text>
</svg>
