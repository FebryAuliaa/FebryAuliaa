<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" role="img" aria-label="GitHub">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B5E"/><stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="280" height="48" fill="url(#gBg)" rx="6" stroke="#4D96FF" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="0" y="0" width="280" height="48" fill="#60B8FF" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0.1;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="90" y="31" font-size="14" fill="#A8D8FF" text-anchor="middle" font-weight="bold">⬡ GitHub</text>
</svg>
