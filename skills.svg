<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="skills">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bgSkills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D2B5E"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60B8FF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:0"/>
    </linearGradient>
    <!-- Badge gradients per row -->
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/><stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2"/><stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/><stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/><stop offset="100%" style="stop-color:#1E88E5"/>
    </linearGradient>
  </defs>

  <rect width="860" height="260" fill="url(#bgSkills)" rx="10"/>

  <!-- Top bar -->
  <rect width="860" height="34" fill="#0D2B5E" rx="10"/>
  <rect y="18" width="860" height="16" fill="#0D2B5E"/>
  <circle cx="18" cy="17" r="6" fill="#1E3A5F"/>
  <circle cx="38" cy="17" r="6" fill="#1565C0"/>
  <circle cx="58" cy="17" r="6" fill="#1E88E5"/>
  <text x="430" y="22" font-size="12" fill="#60B8FF" text-anchor="middle" font-weight="bold" letter-spacing="2">── skills &amp; stack ──</text>

  <!-- Column header -->
  <rect x="0" y="34" width="860" height="30" fill="#060E1A"/>
  <text x="20" y="54" font-size="11" fill="#4D96FF" font-weight="bold" letter-spacing="3">KATEGORI</text>
  <text x="220" y="54" font-size="11" fill="#4D96FF" font-weight="bold" letter-spacing="3">TEKNOLOGI</text>
  <line x1="200" y1="34" x2="200" y2="260" stroke="#1E88E5" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="0" y1="64" x2="860" y2="64" stroke="#1565C0" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Row 1: Languages -->
  <rect x="0" y="64" width="860" height="40" fill="#0B1F3A" opacity="0.6"/>
  <text x="20" y="89" font-size="12" fill="#60B8FF" font-weight="bold">💻 Languages</text>
  <rect x="220" y="70" width="68" height="24" rx="4" fill="url(#b1)" stroke="#60B8FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="254" y="86" font-size="11" fill="#A8D8FF" text-anchor="middle">Python</text>
  <rect x="296" y="70" width="48" height="24" rx="4" fill="url(#b1)" stroke="#60B8FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="320" y="86" font-size="11" fill="#A8D8FF" text-anchor="middle">C++</text>
  <rect x="352" y="70" width="86" height="24" rx="4" fill="url(#b1)" stroke="#60B8FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="395" y="86" font-size="11" fill="#A8D8FF" text-anchor="middle">JavaScript</text>
  <rect x="446" y="70" width="48" height="24" rx="4" fill="url(#b1)" stroke="#60B8FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="470" y="86" font-size="11" fill="#A8D8FF" text-anchor="middle">SQL</text>
  <line x1="0" y1="104" x2="860" y2="104" stroke="#1565C0" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Row 2: ML/AI -->
  <rect x="0" y="104" width="860" height="40" fill="#060E1A" opacity="0.6"/>
  <text x="20" y="129" font-size="12" fill="#60B8FF" font-weight="bold">🤖 ML / AI</text>
  <rect x="220" y="110" width="90" height="24" rx="4" fill="url(#b2)" stroke="#4D96FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="265" y="126" font-size="11" fill="#A8D8FF" text-anchor="middle">TensorFlow</text>
  <rect x="318" y="110" width="72" height="24" rx="4" fill="url(#b2)" stroke="#4D96FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="354" y="126" font-size="11" fill="#A8D8FF" text-anchor="middle">PyTorch</text>
  <rect x="398" y="110" width="98" height="24" rx="4" fill="url(#b2)" stroke="#4D96FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="447" y="126" font-size="11" fill="#A8D8FF" text-anchor="middle">Scikit-learn</text>
  <rect x="504" y="110" width="58" height="24" rx="4" fill="url(#b2)" stroke="#4D96FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="533" y="126" font-size="11" fill="#A8D8FF" text-anchor="middle">Keras</text>
  <line x1="0" y1="144" x2="860" y2="144" stroke="#1565C0" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Row 3: Data -->
  <rect x="0" y="144" width="860" height="40" fill="#0B1F3A" opacity="0.6"/>
  <text x="20" y="169" font-size="12" fill="#60B8FF" font-weight="bold">📊 Data</text>
  <rect x="220" y="150" width="65" height="24" rx="4" fill="url(#b3)" stroke="#42A5F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="252" y="166" font-size="11" fill="#A8D8FF" text-anchor="middle">Pandas</text>
  <rect x="293" y="150" width="65" height="24" rx="4" fill="url(#b3)" stroke="#42A5F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="325" y="166" font-size="11" fill="#A8D8FF" text-anchor="middle">NumPy</text>
  <rect x="366" y="150" width="70" height="24" rx="4" fill="url(#b3)" stroke="#42A5F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="401" y="166" font-size="11" fill="#A8D8FF" text-anchor="middle">Jupyter</text>
  <rect x="444" y="150" width="90" height="24" rx="4" fill="url(#b3)" stroke="#42A5F5" stroke-opacity="0.3" stroke-width="1"/>
  <text x="489" y="166" font-size="11" fill="#A8D8FF" text-anchor="middle">Matplotlib</text>
  <line x1="0" y1="184" x2="860" y2="184" stroke="#1565C0" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Row 4: Tools -->
  <rect x="0" y="184" width="860" height="40" fill="#060E1A" opacity="0.6"/>
  <text x="20" y="209" font-size="12" fill="#60B8FF" font-weight="bold">🔧 Tools</text>
  <rect x="220" y="190" width="48" height="24" rx="4" fill="url(#b4)" stroke="#90CAF9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="244" y="206" font-size="11" fill="#E3F2FD" text-anchor="middle">Git</text>
  <rect x="276" y="190" width="68" height="24" rx="4" fill="url(#b4)" stroke="#90CAF9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="310" y="206" font-size="11" fill="#E3F2FD" text-anchor="middle">Docker</text>
  <rect x="352" y="190" width="58" height="24" rx="4" fill="url(#b4)" stroke="#90CAF9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="381" y="206" font-size="11" fill="#E3F2FD" text-anchor="middle">Linux</text>
  <rect x="418" y="190" width="72" height="24" rx="4" fill="url(#b4)" stroke="#90CAF9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="454" y="206" font-size="11" fill="#E3F2FD" text-anchor="middle">VS Code</text>

  <!-- Animated scan line -->
  <rect x="0" y="34" width="860" height="2" fill="url(#scanLine)">
    <animate attributeName="y" values="34;258;34" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer row -->
  <rect x="0" y="224" width="860" height="36" fill="#060E1A"/>
  <rect x="0" y="238" width="860" height="22" fill="#060E1A" rx="10"/>
  <text x="430" y="247" font-size="11" fill="#4D96FF" text-anchor="middle" letter-spacing="1">~ always learning, always growing ~</text>
</svg>
