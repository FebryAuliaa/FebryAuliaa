<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Febry Banner">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D2B5E"/>
      <stop offset="100%" style="stop-color:#1A4A8A"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60B8FF"/>
      <stop offset="50%" style="stop-color:#A8D8FF"/>
      <stop offset="100%" style="stop-color:#60B8FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60B8FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative circles background -->
  <circle cx="80" cy="50" r="60" fill="#1565C0" opacity="0.15">
    <animate attributeName="r" values="60;80;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="150" r="80" fill="#0D47A1" opacity="0.15">
    <animate attributeName="r" values="80;60;80" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="20" r="100" fill="#1E88E5" opacity="0.07">
    <animate attributeName="r" values="100;130;100" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Stars -->
  <circle cx="150" cy="30" r="2" fill="#A8D8FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="60" r="1.5" fill="#A8D8FF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="150" r="2" fill="#60B8FF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="100" r="1.5" fill="#A8D8FF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="170" r="1.5" fill="#60B8FF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main name -->
  <text x="430" y="108" font-size="68" font-weight="900" text-anchor="middle" fill="url(#textGrad)" letter-spacing="8" filter="url(#glow)">FEBRY</text>

  <!-- Subtitle -->
  <text x="430" y="140" font-size="13" font-weight="600" text-anchor="middle" fill="#60B8FF" letter-spacing="3" opacity="0">
    ✦  Web Developer  |  UI/UX Enthusiast  |  Creative Coder  ✦
    <animate attributeName="opacity" values="0;0.9" dur="1.5s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="430" y="165" font-size="11" text-anchor="middle" fill="#4D96FF" letter-spacing="2" opacity="0">
    🌊  Building things that float beautifully on the web  🌊
    <animate attributeName="opacity" values="0;0.7" dur="1.5s" begin="0.7s" fill="freeze"/>
  </text>

  <!-- Bottom animated line -->
  <rect x="215" y="182" width="0" height="2" rx="1" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;430" dur="2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</svg>
